<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Face -->
  <circle cx="200" cy="120" r="60" fill="#FFD1A4"/>
  
  <!-- Hair -->
  <path d="M 140 100 Q 140 60, 200 60 Q 260 60, 260 100 Q 260 80, 240 80 Q 220 70, 200 70 Q 180 70, 160 80 Q 140 80, 140 100 Z" fill="#2C3E50"/>
  
  <!-- Graduation Cap -->
  <rect x="140" y="75" width="120" height="15" rx="3" fill="#1E40AF"/>
  <path d="M 100 75 L 200 50 L 300 75 L 200 85 Z" fill="#1E40AF"/>
  <circle cx="300" cy="75" r="4" fill="#FCD34D"/>
  <line x1="300" y1="75" x2="300" y2="120" stroke="#FCD34D" stroke-width="2"/>
  
  <!-- Body/Gown -->
  <path d="M 200 180 L 120 200 L 120 420 L 280 420 L 280 200 Z" fill="#14B8A6"/>
  
  <!-- Gown Details -->
  <path d="M 200 180 L 190 200 L 190 420 L 210 420 L 210 200 Z" fill="#0D9488"/>
  
  <!-- Arms -->
  <ellipse cx="100" cy="250" rx="25" ry="80" fill="#14B8A6"/>
  <ellipse cx="300" cy="250" rx="25" ry="80" fill="#14B8A6"/>
  
  <!-- Hands -->
  <circle cx="100" cy="320" r="18" fill="#FFD1A4"/>
  <circle cx="300" cy="320" r="18" fill="#FFD1A4"/>
  
  <!-- Diploma -->
  <rect x="270" y="300" width="60" height="40" rx="3" fill="#FEF3C7"/>
  <line x1="275" y1="310" x2="325" y2="310" stroke="#CA8A04" stroke-width="1.5"/>
  <line x1="275" y1="320" x2="325" y2="320" stroke="#CA8A04" stroke-width="1.5"/>
  <line x1="275" y1="330" x2="310" y2="330" stroke="#CA8A04" stroke-width="1.5"/>
  
  <!-- Ribbon on Diploma -->
  <rect x="265" y="315" width="8" height="20" fill="#DC2626"/>
  
  <!-- Eyes -->
  <circle cx="185" cy="115" r="5" fill="#2C3E50"/>
  <circle cx="215" cy="115" r="5" fill="#2C3E50"/>
  <circle cx="187" cy="113" r="2" fill="#FFFFFF"/>
  <circle cx="217" cy="113" r="2" fill="#FFFFFF"/>
  
  <!-- Smile -->
  <path d="M 180 130 Q 200 140, 220 130" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Legs/Feet -->
  <rect x="160" y="420" width="35" height="70" fill="#1E293B"/>
  <rect x="205" y="420" width="35" height="70" fill="#1E293B"/>
  <ellipse cx="177" cy="490" rx="20" ry="8" fill="#0F172A"/>
  <ellipse cx="222" cy="490" rx="20" ry="8" fill="#0F172A"/>
</svg>
